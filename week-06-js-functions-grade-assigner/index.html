<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Page title shown in browser tab -->
  <title>The Grade Assigner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
        <!-- Form container for future JS submit handler -->
  <form id="gradeForm">
    <label for="numberInput">Enter a number:</label>
    <!-- Validation: required -->
    <input
      type="number"
      id="numberInput"
      name="number"
      placeholder="e.g. 85"
      required
    />
    <button type="submit">Get Grade</button>
  </form>
  <script src="script.js"></script>
</body>
</html>
